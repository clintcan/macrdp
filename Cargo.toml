[package]
name = "macrdp"
version = "0.11.0"
edition = "2021"
description = "Native RDP server for macOS"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "macrdp"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }

# Logging / errors / config
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
bytes = "1"
rpassword = "7"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
zeroize = "1"
rubato = "0.16"  # 48 kHz SCK capture -> 44.1 kHz output, advertised to client

# TLS for RDP security layer
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.13"  # self-signed cert for first-run / dev
rustls-pemfile = "2"  # read persisted cert.pem / key.pem on subsequent runs
x509-cert = { version = "0.2", default-features = false, features = ["std"] }  # std: Time::to_system_time (cert-expiry warning)
der = "0.7"

# RDP protocol — ironrdp is split into many sub-crates; add only what you use.
ironrdp = "0.17"
ironrdp-server = { version = "0.14", features = ["egfx", "multitransport", "nscodec"] }  # from clintcan/IronRDP — see [patch.crates-io] below
ironrdp-acceptor = "0.12"
ironrdp-pdu = "0.11"
# MS-RDPEDISP monitor-layout PDU types (read-only use: CaptureDisplay::request_layout
# decodes the client's live-resize request). The DVC processor itself is already
# wired up unconditionally inside ironrdp-server; this just gets us the PDU
# accessors (DisplayControlMonitorLayout::monitors()).
ironrdp-displaycontrol = "0.10"
# CSPRNG for the Server Auto-Reconnect Cookie random bits (already in the tree
# via rustls/aws-lc-rs); a direct dep so the base build doesn't rely on the
# multitransport feature for it.
getrandom = "0.2"
ironrdp-cliprdr = "0.9"
ironrdp-core = "0.3"
ironrdp-rdpsnd = "0.11"
# RDPDR drive redirection (gated at runtime by --enable-drive-redirection).
# Carries the server-direction smart-card halves (divergences in clintcan/IronRDP,
# see docs/ironrdp-divergences.md).
ironrdp-rdpdr = "0.9"
# EGFX / H.264 video pipeline (gated at runtime by --enable-h264).
ironrdp-egfx = "0.5"
ironrdp-dvc = "0.10"
ironrdp-svc = "0.10"
nfsserve = "0.11.0"

# Test-only: drive a real IronRDP client through the connect/negotiation
# handshake against our own server over an in-memory stream (see
# src/conn_test.rs). Both are redirected to the pinned git rev by the
# [patch.crates-io] section below, same as the runtime ironrdp-* deps.
[dev-dependencies]
# Paused test clock (`#[tokio::test(start_paused = true)]`) for timing tests
# that must not depend on how fast the CI runner is.
tokio = { version = "1", features = ["test-util"] }
ironrdp-connector = "0.12"
ironrdp-tokio = "0.12"
# For the UDP multitransport loopback test: decode the listener's SYN+ACK reply.
macrdp-rdpeudp = { path = "vendor/macrdp-rdpeudp" }

[build-dependencies]
# Compile the USB-redirection Obj-C shim (src/usb_redirect/usb_spike.m) on macOS.
cc = "1"

# macOS-only: screen capture + input synthesis
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
# ScreenCaptureKit bindings — verify the crate name/version against crates.io;
# alternatives: `screencapturekit`, or direct `objc2`/`objc2-screen-capture-kit`.
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSURL", "NSString", "NSBundle", "NSError", "NSDictionary", "NSNotification", "NSFileCoordinator", "NSFilePresenter", "NSOperation", "block2"] }
block2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSCursor", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "libc"] }
screencapturekit = { version = "2.1", features = ["async"] }

# All ironrdp-* crates come from one source: clintcan/IronRDP, branch `macrdp-79e763a0`,
# which is upstream Devolutions/IronRDP@79e763a0 plus macrdp's divergences in
# ironrdp-server, -acceptor, -rdpdr and -dvc, one commit per divergence. The
# divergence logs are in docs/ironrdp-divergences.md. Take every ironrdp-* crate
# from that one rev: with a mix of sources, cargo builds two copies of crates such
# as ironrdp-pdu and their types don't match. Bump the rev for each change on the
# branch. ironrdp-rdpeusb, -str and -error aren't direct dependencies, but other
# ironrdp crates name them as crates.io dependencies, so they are listed too.
[patch.crates-io]
ironrdp-server         = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-acceptor       = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-rdpdr          = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-dvc            = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-rdpeusb        = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-str            = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-error          = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp                = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-ainput         = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-async          = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-cliprdr        = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-connector      = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-core           = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-displaycontrol = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-egfx           = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-graphics       = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-pdu            = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-rdpsnd         = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-svc            = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-tokio          = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-echo           = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-nscodec        = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-rdpeai         = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-rdpei          = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-rdpemt         = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-rdpeudp        = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-rdpeudp-tokio  = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-tls            = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }
ironrdp-usb            = { git = "https://github.com/clintcan/IronRDP.git", rev = "3e39d746caa2c9f1612fcff3f5ae77906d342c9f" }

# ironrdp-server's `multitransport` feature takes macrdp-rdpeudp as a git
# dependency on this repo. Use the local copy, so there is one.
[patch."https://github.com/clintcan/macrdp"]
macrdp-rdpeudp = { path = "vendor/macrdp-rdpeudp" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
