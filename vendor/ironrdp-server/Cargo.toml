[package]
name = "ironrdp-server"
version = "0.13.0"
readme = "README.md"
description = "Extendable skeleton for implementing custom RDP servers"
# Vendored copy of upstream master ironrdp-server (rebased 2026-05-17 against
# Devolutions/IronRDP@0282d18). Workspace-inherited fields are inlined below
# because we're not inside the IronRDP cargo workspace.
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>", "Teleport <goteleport.com>"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

[lib]
doctest = true
test = false

[features]
default = ["rayon", "qoi", "qoiz"]
helper = ["dep:x509-cert", "dep:rustls-pemfile"]
rayon = ["dep:rayon"]
qoi = ["dep:qoicoubeh", "ironrdp-pdu/qoi"]
qoiz = ["dep:zstd-safe", "qoi", "ironrdp-pdu/qoiz"]
egfx = ["dep:ironrdp-egfx"]
# NSCodec encoder (was vendored divergence 6 — now upstream #1332's ironrdp-nscodec
# crate). macrdp enables it (the macOS Windows App's legacy codec list is NSCodec-only).
nscodec = ["dep:ironrdp-nscodec"]
# (vendored) RDP UDP multitransport (MS-RDPEMT) server support. Default off so
# the standard build is byte-identical. M1 performs the negotiation handshake;
# M3 adds the UDP listener + RDPEUDP SYN/SYN+ACK handshake (pulls in the
# sans-I/O ironrdp-rdpeudp crate for the wire codecs + reliability SM).
multitransport = ["dep:ironrdp-rdpeudp", "dep:getrandom", "dep:boring"]

# Internal (PRIVATE!) features used to aid testing.
# Don't rely on these whatsoever. They may disappear at any time.
__bench = ["dep:visibility"]

[dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["net", "macros", "sync", "rt"] } # public
tokio-rustls = "0.26" # public
async-trait = "0.1"
# path = "../ironrdp-*" entries dropped — we live outside the upstream
# workspace, so cargo resolves these via the root macrdp Cargo.toml's
# [patch.crates-io] redirects (git pin to upstream master).
ironrdp-async = "0.10"
ironrdp-ainput = "0.8"
ironrdp-core = "0.2"
ironrdp-pdu = "0.9" # public
ironrdp-svc = "0.8" # public
ironrdp-cliprdr = "0.7" # public
ironrdp-displaycontrol = "0.8" # public
ironrdp-echo = "0.4" # public
ironrdp-dvc = "0.8" # public
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
ironrdp-acceptor = "0.10" # public
ironrdp-graphics = "0.9" # public
ironrdp-rdpsnd = "0.9" # public
ironrdp-rdpdr = "0.7" # public (vendored — server-direction RDPDR)
# NSCodec encoder (upstream #1332's crate; enabled via the `nscodec` feature).
ironrdp-nscodec = { version = "0.2", optional = true, features = ["encoder"] }
# (USB redirection, divergence 16) MS-RDPEUSB / URBDRC PDU codecs. The fork was
# RETIRED at the a5d1c682 pin bump (its lenient USB-3 caps decode landed upstream);
# now resolved via a git-rev [patch.crates-io], NOT the deleted vendor/ironrdp-rdpeusb
# path. The server-direction DVC processor (ported to a5d1c682's split URBDRC PDUs)
# lives in src/rdpeusb.rs.
ironrdp-rdpeusb = "0.1"
# (vendored, multitransport-only) sans-I/O RDPEUDP/RDPEUDP2 wire codecs +
# reliability state machine. Local path crate (not on crates.io); its own
# [patch.crates-io] is ignored in the macrdp build, where ironrdp-core resolves
# via the root patch to the same git rev.
ironrdp-rdpeudp = { path = "../ironrdp-rdpeudp", optional = true }
getrandom = { version = "0.2", optional = true } # multitransport: CSPRNG cookie
# (vendored, multitransport-only, Phase 2) DTLS 1.2 server for the LOSSY
# (`UdpFecL`) flow — sans-I/O over boring's custom-BIO `SslStream`. BoringSSL is
# vendored + built from source (needs cmake + Go + libclang at build time;
# GitHub-hosted CI runners ship all three). Coexists with rustls's aws-lc-rs/ring
# via symbol prefixing. Only pulled in with the multitransport feature.
boring = { version = "4", optional = true }
tracing = { version = "0.1", features = ["log"] }
x509-cert = { version = "0.2.5", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
rayon = { version = "1.12.0", optional = true }
bytes = "1"
visibility = { version = "0.1", optional = true }
qoicoubeh = { version = "0.5", optional = true }
zstd-safe = { version = "7.2", optional = true }
ironrdp-egfx = { version = "0.3", optional = true }

# (vendored, divergence 15) kernel TCP RTT sample at accept (TCP_CONNECTION_INFO).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }

# [lints] workspace = true — inlined as empty since we're not in the workspace.
[lints]

# Honored ONLY when this crate is built standalone (isolated validation during a
# pin bump); IGNORED when it's a path dependency of macrdp (the root Cargo.toml's
# [patch] wins). Mirrors the root's wiring: vendored siblings by path, the rest
# git-pinned to the same rev, + the two-sided ironrdp-dvc patch (the git crates
# depend on it within the IronRDP workspace). Keep the rev in sync with the root.
[patch.crates-io]
ironrdp-acceptor       = { path = "../ironrdp-acceptor" }
ironrdp-rdpdr          = { path = "../ironrdp-rdpdr" }
ironrdp-dvc            = { path = "../ironrdp-dvc" }
ironrdp-core           = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-pdu            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-svc            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-cliprdr        = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-echo           = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-async          = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-ainput         = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-tokio          = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-graphics       = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-rdpsnd         = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-egfx           = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-rdpeusb        = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-nscodec        = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-connector      = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-str            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }
ironrdp-error          = { git = "https://github.com/Devolutions/IronRDP.git", rev = "a5d1c682fd1f65287f6f5727bdead2aef7a2bea7" }

[patch."https://github.com/Devolutions/IronRDP.git"]
ironrdp-dvc = { path = "../ironrdp-dvc" }
