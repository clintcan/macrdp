[package]
name = "ironrdp-server"
version = "0.13.0"
readme = "README.md"
description = "Extendable skeleton for implementing custom RDP servers"
# Vendored copy of upstream ironrdp-server at Devolutions/IronRDP@e258f6a0 (same rev
# as the git pins in the root Cargo.toml). Workspace-inherited fields are inlined
# below because we're not inside the IronRDP cargo workspace. See CLAUDE.md for the
# divergence log; every macrdp addition here is marked "(macrdp)".
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>", "Teleport <goteleport.com>"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

[lib]
doctest = true
test = false

[features]
default = ["rayon", "qoi", "qoiz"]
helper = ["dep:x509-cert", "dep:rustls-pemfile"]
rayon = ["dep:rayon"]
qoi = ["dep:qoicoubeh", "ironrdp-pdu/qoi"]
qoiz = ["dep:zstd-safe", "qoi", "ironrdp-pdu/qoiz"]
egfx = ["dep:ironrdp-egfx"]
# (macrdp) upstream: ["dep:ironrdp-rdpeusb", "dep:ironrdp-usb"]. ironrdp-rdpeusb is a
# regular dependency here because macrdp's own USB channel (src/rdpeusb.rs) always uses it.
usb = ["dep:ironrdp-usb"]
# Opt-in NSCodec encoder. Off by default so consumers that don't need a legacy
# bitmap codec fallback (e.g., RemoteFX-only or H.264-capable clients) don't
# pay the extra build cost.
nscodec = ["dep:ironrdp-nscodec"]
# (macrdp) macrdp's own RDP UDP multitransport (src/mt/): RDPEUDP + DTLS lossy flow +
# Soft-Sync, independent of upstream's `with_udp_transport` path. Off by default.
multitransport = ["dep:macrdp-rdpeudp", "dep:getrandom", "dep:boring"]

# Internal (PRIVATE!) features used to aid testing.
# Don't rely on these whatsoever. They may disappear at any time.
__bench = ["dep:visibility"]

[dependencies]
# path = "../ironrdp-*" entries dropped: we live outside the upstream workspace, so
# cargo resolves these via the root macrdp Cargo.toml's [patch.crates-io] redirects.
rand = "0.9"
anyhow = "1.0" # (macrdp) error type of macrdp's own channel modules (rdpdr_drive, rdpeusb, mt)
tokio = { version = "1", features = ["net", "macros", "sync", "rt", "time"] }
tokio-rustls = "0.26" # public
async-trait = "0.1"
ironrdp-async = "0.10"
ironrdp-ainput = "0.8"
ironrdp-connector = "0.10" # public
ironrdp-core = "0.2"
ironrdp-egfx = { version = "0.3", optional = true }
ironrdp-error = { version = "0.2", features = ["std"] } # public
ironrdp-nscodec = { version = "0.2", optional = true, features = ["encoder"] }
ironrdp-pdu = "0.9" # public
ironrdp-svc = "0.8" # public
ironrdp-cliprdr = "0.7" # public
ironrdp-displaycontrol = "0.8" # public
ironrdp-echo = "0.4" # public
ironrdp-dvc = "0.8" # public
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
ironrdp-acceptor = "0.10" # public
ironrdp-graphics = "0.9" # public
ironrdp-rdpdr = "0.7" # public
ironrdp-rdpsnd = "0.9" # public
ironrdp-rdpei = "0.1" # public
ironrdp-rdpeai = "0.1" # public
ironrdp-rdpeusb = "0.1" # (macrdp) not optional, see the `usb` feature
ironrdp-usb = { version = "0.1", optional = true }
ironrdp-rdpemt = "0.1" # public
ironrdp-rdpeudp = "0.1" # public
ironrdp-rdpeudp-tokio = "0.1" # public
tracing = { version = "0.1", features = ["log"] }
x509-cert = { version = "0.3", optional = true }
rustls-pemfile = { version = "2.2", optional = true }
rayon = { version = "1.12", optional = true }
bytes = "1"
visibility = { version = "0.1", optional = true }
qoicoubeh = { version = "0.5", optional = true }
zstd-safe = { version = "7.2", optional = true }
# (macrdp, `multitransport`) macrdp's own sans-I/O RDPEUDP wire codecs + reliability
# state machine (vendor/macrdp-rdpeudp; unrelated to upstream's ironrdp-rdpeudp).
macrdp-rdpeudp = { path = "../macrdp-rdpeudp", optional = true }
getrandom = { version = "0.2", optional = true } # (macrdp, `multitransport`) offer cookie
# (macrdp, `multitransport`) DTLS 1.2 server for the lossy (`UdpFecL`) flow, sans-I/O
# over boring's custom-BIO `SslStream`. BoringSSL is vendored and built from source
# (needs cmake + Go + libclang at build time; GitHub-hosted runners ship all three).
# Coexists with rustls's aws-lc-rs/ring via symbol prefixing.
boring = { version = "4", optional = true }

# (macrdp) kernel TCP RTT sampled at accept (TCP_CONNECTION_INFO).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }

# [lints] workspace = true, inlined as empty since we're not in the workspace.
[lints]

# Honored ONLY when this crate is built standalone (isolated validation during a pin
# bump); IGNORED when it's a path dependency of macrdp (the root Cargo.toml's [patch]
# wins). Mirrors the root's wiring: vendored siblings by path, the rest git-pinned to
# the same rev, + the two-sided ironrdp-dvc patch (the git crates depend on it within
# the IronRDP workspace). Keep the rev in sync with the root.
[patch.crates-io]
ironrdp-acceptor       = { path = "../ironrdp-acceptor" }
ironrdp-rdpdr          = { path = "../ironrdp-rdpdr" }
ironrdp-dvc            = { path = "../ironrdp-dvc" }
ironrdp-core           = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-pdu            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-svc            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-cliprdr        = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-echo           = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-async          = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-ainput         = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-tokio          = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-graphics       = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-rdpsnd         = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-egfx           = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-rdpeusb        = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-nscodec        = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-connector      = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-str            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-error          = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-rdpei          = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-rdpeai         = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-rdpemt         = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-rdpeudp        = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-rdpeudp-tokio  = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-tls            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-usb            = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }

[patch."https://github.com/Devolutions/IronRDP.git"]
ironrdp-dvc = { path = "../ironrdp-dvc" }
