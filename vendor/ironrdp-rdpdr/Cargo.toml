[package]
name = "ironrdp-rdpdr"
version = "0.7.0"
readme = "README.md"
description = "RDPDR channel implementation."
# Vendored copy of upstream ironrdp-rdpdr at Devolutions/IronRDP@e258f6a0 (same rev
# as the git pins in the root Cargo.toml). Workspace-inherited fields are inlined
# below because we're not inside the IronRDP cargo workspace. The divergence is two
# new files (server-direction encoders/decoders) wired in by four lines across three
# upstream files; see CLAUDE.md for the log.
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>", "Teleport <goteleport.com>"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

[lib]
doctest = false
test = false

[dependencies]
# path = "../ironrdp-*" entries dropped — we live outside the upstream
# workspace, so cargo resolves these via the root macrdp Cargo.toml's
# [patch.crates-io] redirects (git pin to upstream master).
ironrdp-core = { version = "0.2" } # public
ironrdp-error = { version = "0.2" } # public
ironrdp-pdu = "0.9" # public
ironrdp-svc = "0.8" # public
tracing = { version = "0.1", features = ["log"] }
bitflags = "2.11"
getrandom = { version = "0.3", features = ["std"] }

# Honored ONLY when this crate is built standalone (for isolated validation / CI);
# ignored when it's a path dependency of macrdp (the root Cargo.toml's [patch] wins).
# Keep the rev in sync with the root Cargo.toml when bumping the IronRDP pin.
[patch.crates-io]
ironrdp-core  = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-error = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-pdu   = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
ironrdp-svc   = { git = "https://github.com/Devolutions/IronRDP.git", rev = "e258f6a06b1fecfc3829a56928043bced1c8ba66" }
